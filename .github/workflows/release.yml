name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  docs:
    name: docs bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.97.1
      - run: bin/docs-bundle "$GITHUB_REF_NAME"
      - name: Attach to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG" '$0 == "## " tag || index($0, "## " tag " ") == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > tmp/notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "tmp/docs-$TAG.tar.gz" --clobber
          else
            gh release create "$TAG" "tmp/docs-$TAG.tar.gz" --verify-tag --title "pito-storekit $TAG" --notes-file tmp/notes.md
          fi
